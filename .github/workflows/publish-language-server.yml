name: Publish language server

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'language-server-v')
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Check out tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Reject high-severity production vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Test publishable package
        run: |
          node scripts/validate-language-server-package.mjs --release
          node scripts/validate-versions.mjs --tag=${{ github.event.release.tag_name }}
          npm run check --workspace packages/language-server
          npm test --workspace packages/language-server
          node scripts/test-language-server-package.mjs

      - name: Publish to npm
        run: npm publish --workspace packages/language-server --access public --provenance
